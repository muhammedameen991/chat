<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="groveSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCB3D" />
      <stop offset="100%" stop-color="#F1A344" />
    </linearGradient>
    <linearGradient id="groveGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5D9253" />
      <stop offset="100%" stop-color="#557945" />
    </linearGradient>
    <filter id="groveShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#263126" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Golden Grove Rounded Chat Crest -->
  <rect x="6" y="8" width="52" height="42" rx="18" fill="url(#groveSun)" filter="url(#groveShadow)" />
  <path d="M16 50 L10 58 C10 58 18 55 24 50 Z" fill="#F1A344" />

  <!-- Nature Grove Leaves & Tree Emblem -->
  <!-- Left Leaf -->
  <path d="M32 38 C23 35 21 24 28 17 C32 23 34 32 32 38 Z" fill="#557945" />
  <!-- Right Leaf -->
  <path d="M32 38 C41 35 43 24 36 17 C32 23 30 32 32 38 Z" fill="#5D9253" />
  <!-- Central Sprout / Sunlight Stem -->
  <circle cx="32" cy="18" r="3.2" fill="#FFF9ED" />
  <path d="M32 22 L32 40" stroke="#FFF9ED" stroke-width="2.2" stroke-linecap="round" />
  <path d="M32 30 L27 26" stroke="#FFF9ED" stroke-width="1.8" stroke-linecap="round" />
  <path d="M32 33 L37 29" stroke="#FFF9ED" stroke-width="1.8" stroke-linecap="round" />
</svg>
