<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCED8" />
      <stop offset="100%" stop-color="#FFE8C4" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#34272B" flood-opacity="0.08" />
    </filter>
  </defs>
  <!-- Main Rounded Chat Bubble -->
  <rect x="4" y="6" width="40" height="32" rx="14" fill="url(#roseGrad)" filter="url(#softShadow)" />
  <!-- Small tail -->
  <path d="M12 38 L8 44 C8 44 14 42 18 38 Z" fill="#FFCED8" />
  <!-- Mesh Peer Nodes and Connections -->
  <circle cx="16" cy="22" r="3.5" fill="#34272B" />
  <circle cx="28" cy="16" r="3" fill="#34272B" />
  <circle cx="32" cy="26" r="3" fill="#34272B" />
  <!-- Mesh Connecting Lines -->
  <line x1="16" y1="22" x2="28" y2="16" stroke="#34272B" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2 1" />
  <line x1="28" y1="16" x2="32" y2="26" stroke="#34272B" stroke-width="1.8" stroke-linecap="round" />
  <line x1="16" y1="22" x2="32" y2="26" stroke="#34272B" stroke-width="1.8" stroke-linecap="round" />
</svg>
